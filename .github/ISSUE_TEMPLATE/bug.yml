name: Lỗi
description: Có gì đó hỏng hoặc trông sai
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: Chuyện gì đã xảy ra
      description: Và bạn mong đợi điều gì. Có ảnh chụp càng tốt.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Cách để lỗi xảy ra lại
      placeholder: |
        1. Mở Caro, tạo phòng
        2. ...
  - type: input
    id: device
    attributes:
      label: Thiết bị và trình duyệt
      placeholder: iPhone 13, Safari
  - type: input
    id: version
    attributes:
      label: Phiên bản
      description: Hiện ở cuối bảng âm thanh (nút loa, góc trên bên phải).
      placeholder: v0.1.0 · 1a2b3c4
