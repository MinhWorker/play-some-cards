name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Keeps a "chore(main): release x.y.z" PR open with the next version and CHANGELOG.md.
  # Merging it tags vX.Y.Z and publishes a GitHub release.
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # Optional RELEASE_TOKEN (a PAT) lets CI run on the release PR; GITHUB_TOKEN can't
          # trigger other workflows.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
