name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # The Godot client (apps/client, games/*/godot): the pinned toolchain, its checks, the web export
  # and one headless look at the exported build.
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: |
            .tools/godot
            .tools/gdtoolkit
          key: godot-${{ runner.os }}-${{ hashFiles('tools/godot/version.json') }}
      - run: npm run setup:godot
      - run: npm run godot:check
      # The SDK against a real server (dev, no database): two clients play Caro by room code.
      - run: npm run godot:net
      - run: npm run godot:export
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run godot:smoke
      # The Godot scenarios (scripts/e2e/scenarios/godot-*.mjs) in the debug build (it has the
      # test bridge), against the dev app, which serves the build at /godot/.
      - run: npm run godot:export -- --debug
      - name: Start the app
        env:
          BOT_DELAY_MS: 200
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 120); do
            curl -sf localhost:8033/api/health > /dev/null && curl -sf localhost:5033/godot/ > /dev/null && exit 0
            sleep 1
          done
          cat dev.log; exit 1
      - run: npm run e2e -- --only 'godot-*' --retries 1
      - name: Dev server log
        if: failure()
        run: cat dev.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: godot-web
          path: |
            .shots/
            .e2e/
          # Both folders start with a dot: without this the upload finds nothing.
          include-hidden-files: true
          retention-days: 7

  # Which e2e scenarios (scripts/e2e/scenarios/) this change needs: all of them on main, the
  # ones the changed files touch on a PR (none for docs), none for a release PR (versions only).
  # Paused while the games move to Godot (#108): nobody plays the Phaser app until then, so it
  # picks none and the required e2e check passes. Remove PAUSED below to run them again.
  e2e-plan:
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.pick.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: pick
        env:
          PAUSED: 'true'
          # Scenarios of the Godot client: the godot job runs them on its own build.
          GODOT: 'godot-*'
          EVENT: ${{ github.event_name }}
          BASE: origin/${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$PAUSED" = true ] || [[ "$HEAD_REF" == release-please--* ]]; then list='[]'
          elif [ "$EVENT" = pull_request ]; then list=$(node scripts/e2e.mjs --list --skip "$GODOT" --changed "$BASE")
          else list=$(node scripts/e2e.mjs --list --skip "$GODOT")
          fi
          echo "scenarios=$list" >> "$GITHUB_OUTPUT"
          echo "E2E scenarios: $list" >> "$GITHUB_STEP_SUMMARY"

  # One machine per scenario, so the slowest scenario sets the time, not their sum. Each runs
  # the real app in headless Chromium against a server without a database.
  e2e-run:
    needs: e2e-plan
    if: needs.e2e-plan.outputs.scenarios != '[]'
    name: e2e (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.e2e-plan.outputs.scenarios) }}
    env:
      # Computer players move without the pause people need to follow along.
      BOT_DELAY_MS: 200
      XOMDAO_DEV: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # System libraries always; the browser download is skipped when the cache has it.
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Start the app
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 120); do
            curl -sf localhost:8033/api/health > /dev/null && curl -sf localhost:5033 > /dev/null && exit 0
            sleep 1
          done
          cat dev.log; exit 1
      - if: strategy.job-index == 0
        run: npm run smoke
      - run: npm run e2e -- --only ${{ matrix.scenario }} --retries 1
      - name: Dev server log
        if: failure()
        run: cat dev.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ matrix.scenario }}
          path: .e2e/
          retention-days: 7

  # The required check: passes when every picked scenario passed, or none was needed.
  e2e:
    needs: [e2e-plan, e2e-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.e2e-plan.result }}
          RUN: ${{ needs.e2e-run.result }}
        run: |
          echo "plan: $PLAN, run: $RUN"
          [ "$PLAN" = success ] && { [ "$RUN" = success ] || [ "$RUN" = skipped ]; }
