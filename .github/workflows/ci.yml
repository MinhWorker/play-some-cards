name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # The Godot client (apps/client, games/*/godot): the pinned toolchain, its checks, the web export
  # and one headless look at the exported build.
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: |
            .tools/godot
            .tools/gdtoolkit
          key: godot-${{ runner.os }}-${{ hashFiles('tools/godot/version.json') }}
      - run: npm run setup:godot
      - run: npm run godot:check
      # The SDK against a real server (dev, no database): two clients play Caro by room code.
      - run: npm run godot:net
      - run: npm run godot:export
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run godot:smoke
      # The e2e scenarios (scripts/e2e/scenarios/) in the debug build (it has the test bridge),
      # against the dev app, which serves the build at /.
      - run: npm run godot:export -- --debug
      - name: Start the app
        env:
          BOT_DELAY_MS: 200
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 120); do
            curl -sf localhost:8033/api/health > /dev/null && curl -sf localhost:5033/ > /dev/null && exit 0
            sleep 1
          done
          cat dev.log; exit 1
      # Bots play Caro over the WebSocket against the running server.
      - run: npm run smoke
      - run: npm run e2e -- --retries 1
      - name: Dev server log
        if: failure()
        run: cat dev.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: godot-web
          path: |
            .shots/
            .e2e/
          # Both folders start with a dot: without this the upload finds nothing.
          include-hidden-files: true
          retention-days: 7

  # The required check (branch protection): the godot job above runs every e2e scenario.
  e2e:
    needs: godot
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          GODOT: ${{ needs.godot.result }}
        run: |
          echo "godot: $GODOT"
          [ "$GODOT" = success ]
