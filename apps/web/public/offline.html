<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8fd3f4" />
    <title>Chút Bài</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #8fd3f4;
        color: #23364b;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(28rem, calc(100% - 3rem));
        padding: 2rem;
        border: 2px solid #d7a66c;
        border-radius: 1.5rem;
        background: #fff8e8;
        text-align: center;
        box-shadow: 0 1rem 2rem #35516b33;
      }

      h1 {
        margin: 0 0 0.5rem;
      }

      p {
        margin: 0 0 1.5rem;
      }

      button {
        border: 0;
        border-radius: 0.75rem;
        padding: 0.75rem 1.25rem;
        background: #ffd45c;
        color: inherit;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bạn đang ngoại tuyến</h1>
      <p>Chút Bài cần kết nối mạng để chơi.</p>
      <button type="button" onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
