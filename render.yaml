# Render Blueprint for the game server (apps/server). The Godot client is on Vercel.
services:
  - type: web
    name: xomdao-server
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/MinhWorker/xom-dao
    branch: main
    buildCommand: npm ci && npm run build -w @xomdao/shared && npm run build -w @xomdao/server
    startCommand: npm start -w @xomdao/server
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - apps/server/**
        - packages/shared/**
        - packages/sdk/**
        - games/**
        - scripts/libs.mjs
        - package-lock.json
        # The root package.json holds the app version (bumped by release PRs).
        - package.json
    # Never set XOMDAO_DEV here: it grants room members full game-state commands.
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Neon Postgres, branch "main" (pooled URL). Secret: set in the Render dashboard.
      - key: DATABASE_URL
        sync: false
