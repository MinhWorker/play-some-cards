# Render Blueprint for the game server (apps/server). The web app is on Vercel.
services:
  - type: web
    name: play-some-cards-server
    runtime: node
    plan: free
    region: singapore
    repo: https://github.com/MinhWorker/play-some-cards
    branch: main
    buildCommand: npm ci && npm run build -w @psc/shared && npm run build -w @psc/server
    startCommand: npm start -w @psc/server
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - apps/server/**
        - packages/shared/**
        - package-lock.json
    envVars:
      - key: NODE_VERSION
        value: "22"
